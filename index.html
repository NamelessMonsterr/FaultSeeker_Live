<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaultSeeker // Forensic Console</title>  <script type="module" crossorigin src="./assets/index-B9Da4QyI.js?v=3"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-ut3zQWOW.css?v=3">
  <script>
(function(){
  var DL_ID='fs-tx-presets';
  function build(items){
    if(document.getElementById(DL_ID)) return;
    var dl=document.createElement('datalist'); dl.id=DL_ID;
    items.forEach(function(p){
      var o=document.createElement('option');
      o.value=p.hash;
      o.label=p.calls? p.protocol+' - '+p.date+' - '+p.loss+' ('+p.calls+' calls, ETH)' : p.protocol;
      dl.appendChild(o);
    });
    document.body.appendChild(dl);
  }
  function attach(){
    var inp=document.querySelector('input[placeholder^="0x"]');
    if(inp && inp.getAttribute('list')!==DL_ID) inp.setAttribute('list',DL_ID);
  }
  // --- crash-proof results overlay + recent-runs history (plain DOM, no React) ---
  var CSS='position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;overflow:auto;padding:28px;font-family:monospace;color:#9fef9f;';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function bar(label,v){var pct=Math.round((+v||0)*100);return '<div style="display:flex;gap:8px;align-items:center;margin:2px 0"><span style="width:190px;color:#c9a227;font-size:11px">'+label+'</span><span style="display:inline-block;width:220px;border:1px solid #2e4d2e;height:10px"><span style="display:block;height:100%;width:'+Math.min(pct,100)+'%;background:#c9a227"></span></span><span style="font-size:11px">'+pct+'%</span></div>'}
  function renderResult(res){
    var h='<div style="max-width:900px;margin:0 auto">';
    h+='<div style="font-size:16px;color:#ff9900;letter-spacing:2px;margin-bottom:2px">FAULTSEEKER<span style="color:#f33">++</span> - RUN RESULT</div>';
    h+='<div style="font-size:11px;color:#777;margin-bottom:14px">'+(res._saved?'saved replay of a real completed run':'live pipeline result')+'</div>';
    h+='<div style="font-size:12px;margin-bottom:10px;word-break:break-all">tx '+(esc(res.transaction_hash)||'?')+' <span style="color:#777">('+(esc(res.chain)||'?')+', '+Math.round(res.duration||0)+'s)</span></div>';
    var cards=res.evidence_cards||[], scored=res.scored_functions||[];
    var verdict=cards.length?'CONFIRMED':(scored.length?'SUSPECT':'CLEAN');
    var vc=cards.length?'#ff5555':(scored.length?'#ff9900':'#5f5');
    h+='<div style="font-size:20px;margin:8px 0;color:'+vc+'">'+verdict+' <span style="font-size:12px;color:#9fef9f">priority score '+Math.round((res.priority_score||0)*100)+'%</span></div>';
    var pr=res.priority||{};
    h+='<div style="margin:10px 0">'+bar('PRIORITY SCORE',res.priority_score)+bar('EXPLOITABILITY',pr.exploitability)+bar('REENTRANCY',(res.reentrancy||{}).score)+bar('FLASHLOAN',pr.flashloan)+bar('PRICE MANIPULATION',pr.price_manipulation)+bar('LIQUIDITY DRAIN',pr.liquidity_drain)+'</div>';
    if((res.reentrancy||{}).tier) h+='<div style="font-size:11px;color:#777;margin-bottom:10px">reentrancy tier: '+esc(res.reentrancy.tier)+'</div>';
    if(scored.length){
      h+='<div style="color:#c9a227;font-size:12px;margin:12px 0 6px">SCORED FUNCTIONS ('+scored.length+')</div>';
      scored.forEach(function(f){
        var conf=(f.confidence&&f.confidence.explanation&&f.confidence.explanation[0])||'';
        h+='<div style="border:1px solid #2e4d2e;padding:10px;margin:6px 0"><div style="font-size:13px">'+esc(f['function'])+' <span style="color:#777;font-size:11px;word-break:break-all">'+esc(f.address)+' (depth '+esc(f.depth||1)+')</span></div><div style="font-size:11px;color:#c9a227;margin:4px 0">'+esc(conf)+'</div>';
        (f.evidence||[]).forEach(function(e){h+='<div style="font-size:11px;color:#9fef9f;margin:3px 0">- '+esc(e)+'</div>'});
        h+='</div>';
      });
    }
    if(!scored.length&&cards.length){
      h+='<div style="color:#c9a227;font-size:12px;margin:12px 0 6px">EVIDENCE CARDS ('+cards.length+')</div>';
      cards.forEach(function(c){
        var sig=c.function_signature||{};
        h+='<div style="border:1px solid #2e4d2e;padding:10px;margin:6px 0"><div style="font-size:13px">'+esc(sig['function'])+' <span style="color:#777;font-size:11px;word-break:break-all">'+esc(sig.address)+'</span></div>';
        (c.evidence||[]).forEach(function(e){h+='<div style="font-size:11px;margin:3px 0">- '+esc(e)+'</div>'});
        h+='</div>';
      });
    }
    h+='</div>';
    return h;
  }
  var overlayEl=null;
  function closeOverlay(){if(overlayEl){overlayEl.remove();overlayEl=null}}
  function showResult(res,runId){
    closeOverlay();
    overlayEl=document.createElement('div');
    overlayEl.style.cssText=CSS;
    overlayEl.innerHTML='<div style="max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center"><span style="color:#777;font-size:11px">run '+(runId||'')+'</span><button id="fs-ov-close" style="background:#16301a;color:#c8e6c9;border:1px solid #2e4d2e;font-family:monospace;padding:6px 14px;cursor:pointer">CLOSE</button></div>'+renderResult(res);
    document.body.appendChild(overlayEl);
    document.getElementById('fs-ov-close').onclick=closeOverlay;
  }
  function loadResult(runId){
    fetch('/api/result/'+runId).then(function(r){if(!r.ok)throw new Error('no result yet');return r.json()}).then(function(res){showResult(res,runId)}).catch(function(e){alert(e.message)});
  }
  function histPanel(){
    if(document.getElementById('fs-hist')) return;
    var b=document.createElement('button');
    b.id='fs-hist';
    b.textContent='RECENT RUNS';
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9998;background:#16301a;color:#c8e6c9;border:1px solid #2e4d2e;font-family:monospace;padding:6px 12px;cursor:pointer;font-size:11px;letter-spacing:1px';
    b.onclick=function(){
      fetch('/api/runs').then(function(r){return r.json()}).then(function(d){
        closeOverlay();
        overlayEl=document.createElement('div');
        overlayEl.style.cssText=CSS;
        var h='<div style="max-width:900px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:16px;color:#ff9900;letter-spacing:2px">RECENT RUNS</span><button id="fs-ov-close" style="background:#16301a;color:#c8e6c9;border:1px solid #2e4d2e;font-family:monospace;padding:6px 14px;cursor:pointer">CLOSE</button></div>';
        (d.runs||[]).forEach(function(r){
          var br=r.brief||{};
          var col=r.status==='completed'?'#5f5':(r.status==='running'?'#ff9900':'#777');
          h+='<div style="border:1px solid #2e4d2e;padding:8px 10px;margin:5px 0;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="color:'+col+'">'+esc(r.status)+'</span><span style="color:#777">'+esc((r.started_at||'').replace('T',' ').slice(0,19))+'</span><span style="word-break:break-all">'+esc((r.txn_hash||'').slice(0,18))+'...</span><span style="color:#777">'+esc(r.model)+'</span>'+(br.scored_functions!=null?'<span>scored '+br.scored_functions+', cards '+br.evidence_cards+', score '+Math.round((br.priority_score||0)*100)+'%</span>':'')+(r.status==='completed'?'<button data-rid="'+esc(r.run_id)+'" class="fs-ov-open" style="background:#16301a;color:#c8e6c9;border:1px solid #2e4d2e;font-family:monospace;padding:4px 10px;cursor:pointer">VIEW RESULT</button>':'')+'</div>';
        });
        h+='</div>';
        overlayEl.innerHTML=h;
        document.body.appendChild(overlayEl);
        document.getElementById('fs-ov-close').onclick=closeOverlay;
        Array.prototype.forEach.call(document.querySelectorAll('.fs-ov-open'),function(x){x.onclick=function(){loadResult(x.getAttribute('data-rid'))}});
      }).catch(function(){});
    };
    document.body.appendChild(b);
  }
  // last line of defense: if the React view ever crashes, keep results reachable
  function armCrashGuard(){
    if(window.__fsGuardArmed) return; window.__fsGuardArmed=true;
    function guard(msg){
      if(document.getElementById('fs-crash')) return;
      var d=document.createElement('div');
      d.id='fs-crash';
      d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:10000;background:#1a0f0f;border-top:2px solid #ff5555;color:#ffb0b0;font-family:monospace;font-size:12px;padding:10px 16px;display:flex;gap:14px;align-items:center';
      d.innerHTML='<span>view crashed ('+esc(msg).slice(0,120)+') - your results are safe.</span><button id="fs-crash-open" style="background:#16301a;color:#c8e6c9;border:1px solid #2e4d2e;font-family:monospace;padding:6px 12px;cursor:pointer">OPEN RECENT RUNS</button>';
      document.body.appendChild(d);
      var b=document.getElementById('fs-crash-open');
      if(b) b.onclick=function(){var hb=document.getElementById('fs-hist'); if(hb) hb.click()};
    }
    window.addEventListener('error',function(e){guard(e.message||'script error')},true);
    window.addEventListener('unhandledrejection',function(e){guard((e.reason&&e.reason.message)||'async error')});
  }
  fetch('/api/config').then(function(r){return r.json()}).then(function(c){
    if(c.preset_txs){build(c.preset_txs); attach(); new MutationObserver(attach).observe(document.body,{childList:true,subtree:true});}
  }).catch(function(){});
  function boot(){histPanel(); armCrashGuard()}
  if(document.body) boot(); else document.addEventListener('DOMContentLoaded',boot);
})();
  </script>
</head>
  <body><div id="root"></div></body>
</html>
